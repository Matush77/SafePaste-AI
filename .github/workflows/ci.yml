name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Unit tests and redaction quality gate
        run: npm test

      - name: Redaction quality report
        run: npm run eval

      - name: Build and package
        run: npm run build:zip

      - name: End-to-end test in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/safepaste-ai-*.zip
          if-no-files-found: error
