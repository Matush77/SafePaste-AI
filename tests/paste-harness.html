<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paste Redactor Harness</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f7f9;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(280px, 420px) minmax(420px, 1fr);
        margin: 0 auto;
        max-width: 1240px;
        padding: 24px;
      }

      h1 {
        font-size: 22px;
        grid-column: 1 / -1;
        margin: 0;
      }

      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      section {
        min-width: 0;
      }

      .cases,
      .results {
        border: 1px solid #d6dce6;
        border-radius: 8px;
        overflow: hidden;
      }

      .case {
        align-items: start;
        background: #ffffff;
        border: 0;
        border-bottom: 1px solid #e5e9f0;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 4px;
        padding: 12px;
        text-align: left;
        width: 100%;
      }

      .case:last-child {
        border-bottom: 0;
      }

      .case[aria-selected="true"] {
        background: #e9f1ff;
      }

      .case strong {
        font-size: 14px;
      }

      .case span {
        color: #5d6b82;
        font-size: 12px;
      }

      .editor {
        background: #ffffff;
        border: 1px solid #aeb8c8;
        border-radius: 8px;
        line-height: 1.45;
        min-height: 260px;
        outline: none;
        padding: 14px;
        white-space: pre-wrap;
      }

      .editor:focus {
        border-color: #3169d8;
        box-shadow: 0 0 0 3px rgba(49, 105, 216, 0.16);
      }

      .actions {
        display: flex;
        gap: 8px;
        margin: 10px 0 16px;
      }

      .actions button {
        background: #172033;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        padding: 9px 12px;
      }

      pre {
        background: #ffffff;
        border: 1px solid #d6dce6;
        border-radius: 8px;
        margin: 0;
        max-height: 300px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      .results {
        background: #ffffff;
        padding: 12px;
      }

      .pass {
        color: #146c43;
      }

      .fail {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Paste Redactor Harness</h1>

      <section>
        <h2>Prompt Cases</h2>
        <div id="cases" class="cases"></div>
      </section>

      <section>
        <h2>Paste Target</h2>
        <div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="Paste target"></div>
        <div class="actions">
          <button id="copyCase" type="button">Copy selected prompt</button>
          <button id="clear" type="button">Clear editor</button>
        </div>
        <h2>Selected Prompt</h2>
        <pre id="source"></pre>
      </section>

      <section>
        <h2>Last Result</h2>
        <div id="result" class="results">No paste yet.</div>
      </section>

      <section>
        <h2>Redacted Text</h2>
        <pre id="redacted"></pre>
      </section>
    </main>

    <script src="../src/redactor.js"></script>
    <script src="../src/siteAdapters.js"></script>
    <script src="paste-scenarios.js"></script>
    <script src="paste-harness.js"></script>
  </body>
</html>
